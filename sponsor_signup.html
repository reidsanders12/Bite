<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sponsor Bite</title>
<style>
  :root {
    --bg-canvas: #FAF3EA;
    --bg-surface: #FFFDF9;
    --bg-alt: #F1E9DC;
    --border: #E4D9C7;
    --text-primary: #2B2622;
    --text-muted: #75695A;
    --accent: #C1652F;
    --accent-on: #FFFDF9;
    --error: #B3261E;
    --success: #4F7942;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-canvas);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--text-muted); font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: var(--text-muted); margin: 16px 0 6px; }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    font-size: 14px;
    color: var(--text-primary);
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-on);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 14px; font-size: 13px; }
  #status.error { color: var(--error); }
  #status.success { color: var(--success); }
</style>
</head>
<body>
  <div class="card">
    <h1>Sponsor Bite</h1>
    <p class="lead">
      Submit your promo below. It won't appear in the app until it's been
      manually reviewed and approved.
    </p>

    <form id="sponsor-form">
      <label for="title">Business / promo name</label>
      <input id="title" required maxlength="80" placeholder="e.g. IronWorks Gym">

      <label for="subtitle">Offer</label>
      <textarea id="subtitle" required maxlength="160" placeholder="e.g. New members get 20% off your first 3 months."></textarea>

      <label for="cta_text">Button text</label>
      <input id="cta_text" maxlength="30" placeholder="Learn More" value="Learn More">

      <label for="icon_name">Icon</label>
      <select id="icon_name">
        <option value="campaign">Megaphone (default)</option>
        <option value="fitness_center">Gym / fitness</option>
        <option value="restaurant">Food / restaurant</option>
        <option value="local_offer">Discount / offer</option>
        <option value="shopping_bag">Shop / retail</option>
        <option value="spa">Wellness / spa</option>
      </select>

      <label for="contact_name">Your name</label>
      <input id="contact_name" required maxlength="80" placeholder="Jane Doe">

      <label for="contact_email">Your email</label>
      <input id="contact_email" type="email" required maxlength="120" placeholder="jane@ironworksgym.com">

      <button id="submit-btn" type="submit">Submit for Review</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
    // Fill these in from your own .env (SUPABASE_URL / SUPABASE_ANON_KEY).
    // The anon key is meant to be public/client-side -- Row Level Security
    // on the `sponsors` table is what actually enforces that a public
    // submission can only ever land as pending/inactive (see
    // supabase_circles_schema.sql's sponsors_insert_public_submission policy).
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const form = document.getElementById("sponsor-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const payload = {
        sponsor_label: "Sponsored",
        title: document.getElementById("title").value.trim(),
        subtitle: document.getElementById("subtitle").value.trim(),
        cta_text: document.getElementById("cta_text").value.trim() || "Learn More",
        icon_name: document.getElementById("icon_name").value,
        contact_name: document.getElementById("contact_name").value.trim(),
        contact_email: document.getElementById("contact_email").value.trim(),
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/sponsors`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal",
          },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const detail = await res.text();
          throw new Error(detail || `Request failed (${res.status})`);
        }

        statusEl.textContent = "Thanks! Your submission is pending review.";
        statusEl.className = "success";
        form.reset();
      } catch (err) {
        statusEl.textContent = `Couldn't submit: ${err.message}`;
        statusEl.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit for Review";
      }
    });
  </script>
</body>
</html>
