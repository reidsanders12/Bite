<!--
  Bite -- "Confirm signup" email template.

  Paste this into: Supabase Dashboard -> Authentication -> Emails ->
  Templates -> "Confirm signup" -> Message body (source/HTML view).
  Subject line is set separately in that same screen -- suggested:
    Confirm your email for Bite

  Uses Supabase's built-in template variables: {{ .ConfirmationURL }} and
  {{ .Email }}. Table-based layout + inline styles on purpose -- email
  clients (Outlook especially) don't reliably support modern CSS/flexbox,
  so this avoids a <style> block and flex/grid entirely. Colors match
  app/theme.py exactly so this doesn't look like a different product.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF3EA; padding:32px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#FFFDF9; border:1px solid #E4D9C7; border-radius:12px;">
        <tr>
          <td style="padding:36px 32px 28px 32px;">

            <!-- Eyebrow wordmark -->
            <p style="margin:0 0 20px 0; font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#C1652F;">
              BITE
            </p>

            <!-- Headline -->
            <h1 style="margin:0 0 12px 0; font-family:Georgia,'Times New Roman',serif; font-size:24px; line-height:1.3; color:#2B2622;">
              Confirm your email
            </h1>

            <!-- Body copy -->
            <p style="margin:0 0 28px 0; font-size:15px; line-height:1.6; color:#75695A;">
              Tap the button below to verify <strong style="color:#2B2622;">{{ .Email }}</strong> and finish setting up your Bite account.
            </p>

            <!-- CTA button -->
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="border-radius:6px; background-color:#C1652F;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block; padding:13px 28px; font-size:15px; font-weight:600; color:#FFFDF9; text-decoration:none; border-radius:6px;">
                    Confirm Email
                  </a>
                </td>
              </tr>
            </table>

            <!-- Fallback plain link -->
            <p style="margin:28px 0 0 0; font-size:12px; line-height:1.6; color:#A79880;">
              Or paste this link into your browser:<br>
              <a href="{{ .ConfirmationURL }}" style="color:#C1652F; word-break:break-all;">{{ .ConfirmationURL }}</a>
            </p>

          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px; border-top:1px solid #E4D9C7;">
            <p style="margin:0; font-size:12px; line-height:1.6; color:#A79880;">
              If you didn't create a Bite account, you can safely ignore this email.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
