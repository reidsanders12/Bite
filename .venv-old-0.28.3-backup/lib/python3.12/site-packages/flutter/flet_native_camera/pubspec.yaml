name: flet_native_camera
description: Flet NativeCamera + BarcodeScanner controls
homepage: https://flet.dev
repository: https://github.com/flet-dev/flet-native-camera/src/flutter/flet_native_camera
version: 0.1.2
environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=1.17.0'
dependencies:
  flutter:
    sdk: flutter
  # image_picker (not camera/CameraController) for photo capture -- opens
  # the OS's own Camera app instead of a hand-rolled live preview widget,
  # far less native code to get wrong. 1.2.1 is the newest release still
  # compatible with this app's Flutter 3.29.2 (bundles Dart SDK 3.7.2);
  # 1.2.2+ requires Dart >=3.9.0. mobile_scanner 7.4.0 already targets
  # sdk: ^3.7.0, so no similar downgrade is needed there.
  image_picker: 1.2.1
  mobile_scanner: ^7.4.0
  flet: ^0.28.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
